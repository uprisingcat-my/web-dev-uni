<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Array - a collection of data
        function run() {
            const numbers = [28, 38, 17, 67, 11, 86, 56, 33];
            //index/position: 0   1   2   3   4   5   6   7

            let html = "";
            html = html + "<ul>";
            let i = 0;
            while(i<8) {
                html = html + "<li>" + numbers[i] + "</li>";
                i++;
            }
            html = html + "</ul>";
            document.getElementById("result").innerHTML = html;
        }
    </script>
</head>
<body>
    <h1>basic_dom_manipulation_tutorial</h1>
    <div id="result"></div>
    <script>
        run();
    </script>
</body>
</html>
