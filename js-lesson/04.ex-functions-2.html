<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //write a functio to accept radius as a parameter to calculate area
        const PI = 3.14159;
        function calculate_area(radius) {
            console.log(`the area of the circle is: ${PI * radius * radius} square units.`)
        }
        //call the function
        calculate_area(12);
        console.log('___1');
        calculate_area(2);
        console.log('___2');
        calculate_area(5);
        console.log('___3');
    </script>
</head>
<body>
    <h1>area-cal using a function call</h1>
</body>
</html>
