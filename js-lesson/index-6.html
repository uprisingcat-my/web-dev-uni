<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add(){
            console.log('start function...');
            let op1 = document.getElementById('operand1').value;
            let op2 = document.getElementById('operand2').value;

            console.log(op1 + op2); // string + string (join)

            op1 = parseFloat(op1); // convert to float
            op2 = parseFloat(op2); // convert to float

            console.log(op1+op2); // float + float (addition)
            document.getElementById('answer').innerHTML = op1 + op2;
            console.log('end function...');
        }

            function sub(){
            console.log('start function...');
            let op1 = document.getElementById('operand1').value;
            let op2 = document.getElementById('operand2').value;

            console.log(op1 - op2); // string - string (auto convert)

            op1 = parseFloat(op1); // convert to float
            op2 = parseFloat(op2); // convert to float

            console.log(op1-op2); // float - float (substraction)
            document.getElementById('answer').innerHTML = op1 - op2;
            console.log('end function...');
        }

            function mul(){
            console.log('start function...');
            let op1 = document.getElementById('operand1').value;
            let op2 = document.getElementById('operand2').value;

            console.log(op1 * op2); // string * string (auto convert)

            op1 = parseFloat(op1); // convert to float
            op2 = parseFloat(op2); // convert to float

            console.log(op1*op2); // float - float (multiplication)
            document.getElementById('answer').innerHTML = op1 * op2;
            console.log('end function...');
        }

            function div(){
            console.log('start function...');
            let op1 = document.getElementById('operand1').value;
            let op2 = document.getElementById('operand2').value;

            console.log(op1 / op2); // string / string (auto convert)

            op1 = parseFloat(op1); // convert to float
            op2 = parseFloat(op2); // convert to float

            console.log(op1/op2); // float / float (division)
            document.getElementById('answer').innerHTML = op1 / op2;
            console.log('end function...');
        }

            function mod(){
            console.log('start function...');
            let op1 = document.getElementById('operand1').value;
            let op2 = document.getElementById('operand2').value;

            console.log(op1 % op2); // string % string (auto convert)

            op1 = parseFloat(op1); // convert to float
            op2 = parseFloat(op2); // convert to float

            console.log(op1%op2); // float % float (modulo operation)
            document.getElementById('answer').innerHTML = op1 % op2;
            console.log('end function...');
        }

    </script>
</head>
<body>
    <h1>simple-cal</h1>
    <label>Number 1:</label>
    <input type="text" id="operand1" />
    <br>
    <label>Number 2:</label>
    <input type="text" id="operand2" />
    <hr>
    <button id="plus" onclick="add();">+</button>
    <button id="minus" onclick="sub();">-</button>
    <button id="multiplication" onclick="mul();">x</button>
    <button id="division" onclick="div();">÷</button>
    <button id="division" onclick="mod();">%</button>
    <hr>
    <label>Answer : <span id='answer'>_</span></label>
</body>
</html>
