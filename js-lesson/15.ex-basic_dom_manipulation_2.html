<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function run() {
            let numbers = [28, 38, 17,67, 11, 86, 56, 33];
            let tableEntries = "<table border=1>";
            let i = 0;
            while(i<8) {
                tableEntries = tableEntries + 
                                    "<tr>" +
                                        "<td>" +
                                            numbers[i] +
                                        "</td>" +
                                    "</tr>"
                i++;
            }
            tableEntries = tableEntries + "</table>";
            document.getElementById("result").innerHTML += tableEntries;
        }
    </script>
</head>
<body>
    <h1>dom_manipulation_tutorial_2</h1>
    <button onclick="run();">generate</button>
    <div id="result"></div>
</body>
</html>
